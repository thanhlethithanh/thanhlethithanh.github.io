<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lê Thị Thanh Thanh | Data Analyst</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; color: #222; background: #f5f6f8; }
    a { text-decoration: none; color: inherit; }

    /* NAV */
    nav { background: #1a2744; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; height: 60px; position: sticky; top: 0; z-index: 10; }
    .nav-brand { color: #fff; font-size: 18px; font-weight: 600; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { color: #b0bcda; font-size: 14px; transition: color 0.2s; }
    .nav-links a:hover { color: #fff; }

    /* HERO */
    .hero { background: #1a2744; color: #fff; padding: 4rem 2rem 3rem; text-align: center; }
    .hero-avatar { width: 80px; height: 80px; border-radius: 50%; background: #2e4080; border: 2px solid #4a6fa5; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #b0ccf0; margin: 0 auto 1.5rem; }
    .hero h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
    .hero p { font-size: 16px; color: #8fa8d0; margin-bottom: 1.5rem; }
    .hero-badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .badge { background: #2e4080; color: #b0ccf0; font-size: 12px; padding: 4px 14px; border-radius: 20px; border: 1px solid #4a6fa5; }

    /* SECTIONS */
    .section { padding: 3rem 2rem; max-width: 860px; margin: 0 auto; }
    .section-title { font-size: 12px; font-weight: 700; color: #2e5fa3; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1.5rem; padding-bottom: 8px; border-bottom: 1px solid #dde3ef; }

    /* ABOUT */
    .about-text { font-size: 15px; line-height: 1.9; color: #444; }

    /* SKILLS */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .skill-card { background: #fff; border: 1px solid #e0e6f0; border-radius: 12px; padding: 1rem 1.25rem; }
    .skill-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .skill-level { font-size: 12px; color: #888; margin-bottom: 10px; }
    .skill-bar-bg { height: 4px; background: #e0e6f0; border-radius: 2px; }
    .skill-bar { height: 4px; border-radius: 2px; background: #2e5fa3; }

    /* PROJECTS */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .project-card { background: #fff; border: 1px solid #e0e6f0; border-radius: 12px; padding: 1.25rem; }
    .project-tag { font-size: 11px; font-weight: 600; color: #2e5fa3; background: #e6f1fb; padding: 3px 10px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    .project-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .project-desc { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 12px; }
    .project-link { font-size: 13px; color: #2e5fa3; }
    .project-link:hover { text-decoration: underline; }

    /* EXPERIENCE */
    .exp-item { display: flex; gap: 14px; margin-bottom: 1.5rem; align-items: flex-start; }
    .exp-dot { width: 10px; height: 10px; border-radius: 50%; background: #2e5fa3; margin-top: 5px; flex-shrink: 0; }
    .exp-role { font-size: 15px; font-weight: 600; }
    .exp-company { font-size: 13px; color: #666; margin: 2px 0; }
    .exp-date { font-size: 12px; color: #2e5fa3; }
    .exp-desc { font-size: 13px; color: #666; margin-top: 6px; line-height: 1.6; }

    /* CONTACT */
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .contact-card { background: #fff; border: 1px solid #e0e6f0; border-radius: 12px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 12px; }
    .contact-icon { width: 38px; height: 38px; border-radius: 8px; background: #1a2744; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #b0ccf0; flex-shrink: 0; }
    .contact-label { font-size: 11px; color: #999; margin-bottom: 2px; }
    .contact-value { font-size: 13px; font-weight: 600; }

    /* FOOTER */
    footer { background: #1a2744; color: #8fa8d0; text-align: center; padding: 1.5rem; font-size: 13px; margin-top: 2rem; }

    hr { border: none; border-top: 1px solid #e8ecf4; }
  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">Lê Thị Thanh Thanh</span>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-avatar">LT</div>
    <h1>Lê Thị Thanh Thanh</h1>
    <p>Data Analyst &middot; Ho Chi Minh City, Vietnam</p>
